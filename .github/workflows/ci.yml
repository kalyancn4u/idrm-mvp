# =============================================================================
#  IDRM MVP — Continuous Integration
#  Runs on every push and every pull request.
#
#  Three jobs:
#    - lint    ruff + the dashboard→app boundary check
#    - test    pytest against a real PostGIS instance, with and without Redis
#    - docker  proves the image builds
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:

  # ---------------------------------------------------------------------------
  #  Lint — fast feedback
  # ---------------------------------------------------------------------------
  lint:
    name: Lint + boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: ruff check
        run: ruff check app dashboard shared tests scripts

      - name: Boundary check (app ↔ dashboard; shared → app, dashboard, FastAPI, Flask)
        run: python scripts/lint_boundaries.py

  # ---------------------------------------------------------------------------
  #  Test — against a real PostGIS instance
  # ---------------------------------------------------------------------------
  test:
    name: Test (PostGIS, with and without Redis)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: idrm_user
          POSTGRES_PASSWORD: idrm_pass
          POSTGRES_DB: idrm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idrm_user -d idrm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+asyncpg://idrm_user:idrm_pass@localhost:5432/idrm_test
      DATABASE_URL_SYNC: postgresql+psycopg2://idrm_user:idrm_pass@localhost:5432/idrm_test
      REDIS_URL: redis://localhost:6379/0
      JWT_PRIVATE_KEY_PATH: keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: keys/jwt_public.pem
      DASHBOARD_SECRET_KEY: ci-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate JWT keypair
        run: python scripts/generate_keys.py

      - name: Apply migrations
        run: alembic upgrade head

      - name: Seed sample data
        run: python -m scripts.seed

      - name: Run the test suite (with Redis)
        run: pytest -q

      - name: Run the test suite (without Redis)
        env:
          REDIS_URL: ""
        run: pytest -q -m "not requires_redis"

      - name: Coverage report
        if: always()
        run: |
          pytest -q --cov=app --cov=dashboard --cov=shared \
              --cov-report=term-missing --cov-fail-under=60

  # ---------------------------------------------------------------------------
  #  Docker build — proves the image builds
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: idrm:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
