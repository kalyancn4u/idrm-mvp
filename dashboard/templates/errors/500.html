{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="state-container">
  <div class="state-icon">⚠️</div>
  <div class="state-title">500 — Something went wrong</div>
  <div class="state-description">The error has been logged. Check <code>logs/idrm.log</code>.</div>
  <a class="btn btn-primary" href="{{ url_for('main.overview') }}">Return to overview</a>
</div>
{% endblock %}
{% block anon_content %}
<div class="login-shell">
  <div class="login-card text-center">
    <div class="state-icon">⚠️</div>
    <h1>500 — Server error</h1>
    <a class="btn btn-primary mt-4" href="{{ url_for('auth.login') }}">Sign in</a>
  </div>
</div>
{% endblock %}
